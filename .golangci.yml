version: "2"

linters:
  default: standard
  enable:
    - recvcheck
    - revive
  settings:
    recvcheck:
      # Count Unmarshal* and GobDecode too, which recvcheck exempts by default, matching the IDE's inspection
      disable-builtin: true
    revive:
      enable-default-rules: true
      rules:
        - name: import-shadowing
        - name: receiver-naming
          arguments:
            - max-length: 1

formatters:
  enable:
    - gofmt
